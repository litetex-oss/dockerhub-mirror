version: 1
creds:
  - registry: ghcr.io
  - registry: docker.io
    user: "{{env \"DOCKERHUB_USER\"}}"
    pass: "{{env \"DOCKERHUB_TOKEN\"}}"
  - registry: dock.mau.dev
defaults:
  parallel: 2
sync:
  - source: ghcr.io/element-hq/lk-jwt-service
    target: litetex/ghcr.element-hq.lk-jwt-service
    type: repository
    tags:
      allow:
      - "latest"
      - "[0-9\\.]*"
      deny:
      # Ignore everything before 0.3
      - "0\\.[0-3]\\..*"
  - source: ghcr.io/google/cadvisor
    target: litetex/ghcr.google.cadvisor
    type: repository
    tags:
      allow:
      - "latest"
      - "[0-9\\.]*"
  - source: ghcr.io/mollyim/mollysocket
    target: litetex/ghcr.mollyim.mollysocket
    type: repository
    tags:
      allow:
      - "latest"
      - "latest-alpine"
      - "[0-9\\.]*"
      - "[0-9\\.]*-alpine"
      deny:
      # Ignore everything before 1.4
      - "1\\.[0-4]"
      - "1\\.[0-4]\\..*"
  - source: dock.mau.dev/mautrix/discord
    target: litetex/mau.mautrix.discord
    type: repository
    tags:
      allow:
      - "latest"
      - "v[0-9\\.]*"
      deny:
      # Ignore everything before 0.7
      - "v0\\.[0-6]\\..*"
      # Accidental
      - "v2"
  - source: dock.mau.dev/mautrix/whatsapp
    target: litetex/mau.mautrix.whatsapp
    type: repository
    tags:
      allow:
      - "latest"
      - "v[0-9\\.]*"
      deny:
      # Ignore everything before 0.2510
      - "v0\\.[0-8]\\..*"
      # Accidental
      - "v2"
  - source: dock.mau.dev/mautrix/signal
    target: litetex/mau.mautrix.signal
    type: repository
    tags:
      allow:
      - "latest"
      - "v[0-9\\.]*"
      deny:
      # Ignore everything before 0.2510
      - "v0\\.1[0-2]\\..*"
      - "v0\\.[0-9]\\..*"
      # Accidental
      - "v2"
  - source: registry.gitlab.com/fmd-foss/fmd-server
    target: litetex/gl.fmd-foss.fmd-server
    type: repository
    tags:
      allow:
      - "[0-9\\.]*"
      - "[0-9\\.]*-alpine"
      - "[0-9\\.]*-debian"
      - "[0-9\\.]*-distroless"
